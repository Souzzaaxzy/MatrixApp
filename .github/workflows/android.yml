name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Flutter project lives in app/, not the repository root.
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Flutter project structure
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml not found in app/. The Flutter project root is misconfigured."
            exit 1
          fi
          echo "pubspec.yaml found — proceeding."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Inject the production API URL. REQUIRED: set the API_BASE_URL
      # repository secret (Settings → Secrets and variables → Actions) to the
      # server's public address on the Bronxys/Pterodactyl panel — the node
      # host/IP + allocated port, e.g. http://123.45.67.89:4316 (no trailing
      # slash). The build FAILS without it: an APK without a real API URL
      # would be useless on a physical device.
      - name: Build APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL secret não configurado. Defina em Settings → Secrets and variables → Actions com o endereço público do servidor (painel Bronxys/Pterodactyl → alocação)."
            exit 1
          fi
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
